services:
  db:
    build:
      context: ./database
    container_name: database
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - transcendence_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  dbgate:
    image: dbgate/dbgate
    container_name: dbgate
    restart: always
    ports:
      - "8000:3000"
    networks:
      - transcendence_network
    depends_on:
      db:
        condition: service_healthy

